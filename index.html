<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hearth">
<meta name="theme-color" content="#1d1220">
<title>Hearth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
:root{--ink:#1d1220;--panel:#2e1d2c;--panel2:#3f2a39;--line:#6b4a55;--cream:#f6e7c8;--dim:#c9b197;--ember:#f2a03d;--red:#d9503f;--moss:#8fb56a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font:20px/1.2 VT323,ui-monospace,Menlo,monospace;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:manipulation}
.px{background:var(--panel);box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),inset 0 0 0 3px var(--line)}
.head{font-family:"Pixelify Sans",VT323,monospace;font-weight:700}

#next{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:460px;margin:auto;padding:9px 13px;display:flex;gap:10px;align-items:baseline;z-index:2}
#next b{color:var(--ember);font-family:"Pixelify Sans",VT323,monospace;font-size:15px;letter-spacing:.5px;white-space:nowrap}
#next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#next em{font-style:normal;color:var(--dim);white-space:nowrap}
#fsBtn{flex:none;width:30px;height:26px;margin:-4px -6px -4px 0;background:none;border:0;padding:4px;color:var(--ember);align-self:center}
#fsBtn svg{width:100%;height:100%;display:block}
#next,#dock{transition:opacity .4s}
body.calm #next,body.calm #dock,body.calm #bubble{opacity:0;pointer-events:none}
body.calm #dock>*{pointer-events:none}

#dock{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));z-index:3;pointer-events:none}
#dock>*{pointer-events:auto}
#bubble{position:fixed;left:12px;right:12px;top:calc(76px + env(safe-area-inset-top));max-width:460px;margin:auto;padding:10px 13px;display:none;gap:10px;align-items:center;background:var(--cream);color:var(--ink);box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink)}
#bubble.on{display:flex}
#bubble p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
#bubble button{background:var(--ink);color:var(--cream);border:0;padding:6px 10px;min-height:36px}
.row{display:flex;align-items:center;justify-content:center;gap:16px;max-width:460px;margin:auto}
.side{width:64px;height:64px;background:var(--panel);border:0;box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),inset 0 0 0 3px var(--line);font-size:17px;padding:0;position:relative}
.side i{position:absolute;top:-8px;right:-6px;background:var(--red);font-style:normal;padding:0 6px;min-width:22px}
#mic{width:92px;height:92px;border:0;background:var(--ember);padding:0;box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),inset -6px -6px 0 #bd6c22,inset 6px 6px 0 #ffd089;display:grid;place-items:center}
#mic svg{width:52px;height:52px;display:block}
#mic.live{background:var(--red);box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),inset -6px -6px 0 #93302a,inset 6px 6px 0 #f2897a;animation:pulse .8s steps(2) infinite}
@keyframes pulse{50%{transform:translateY(-3px)}}
#typeform{max-width:460px;margin:14px auto 0;display:flex}
#say{flex:1;min-width:0;height:46px;background:var(--ink);border:3px solid var(--line);border-right:0;padding:0 10px;outline:0;border-radius:0}
#say:focus{border-color:var(--ember)}
#say::placeholder{color:var(--dim)}
#typeform button{height:46px;border:3px solid var(--line);background:var(--panel2);padding:0 14px;border-radius:0}

#sheet{position:fixed;left:0;right:0;bottom:0;top:12%;max-width:520px;margin:auto;z-index:5;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s steps(5);padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
#tabs{display:flex;padding:6px 6px 0;gap:3px;flex:none}
#tabs button{flex:1;min-width:0;height:44px;background:var(--panel2);border:0;font-size:19px;padding:0}
#tabs button[aria-selected=true]{background:var(--ember);color:var(--ink)}
#tabs #close{flex:0 0 44px}
#body{flex:1;overflow:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
h3{margin:18px 0 6px;font:700 17px "Pixelify Sans",VT323,monospace;color:var(--ember);letter-spacing:.5px}
h3:first-child{margin-top:2px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px solid var(--panel2);min-height:46px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--dim);font-size:18px}
.item.done .t{text-decoration:line-through;color:var(--dim)}
.tick,.x{width:34px;height:34px;flex:none;background:var(--ink);border:3px solid var(--line);padding:0;line-height:1}
.x{background:none;border:0;color:var(--dim)}
.tick.on{background:var(--moss)}
.tag{color:var(--ink);background:var(--moss);padding:0 5px;font-size:16px;margin-right:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:0 12px;min-height:40px;text-decoration:none;margin:3px 6px 3px 0}
.btn.go{background:var(--ember);color:var(--ink);box-shadow:inset -3px -3px 0 #bd6c22}
.empty,.help{color:var(--dim)}
.help{margin:4px 0}
#sw{font:700 56px "Pixelify Sans",VT323,monospace;text-align:center;margin:10px 0;color:var(--cream)}
.center{text-align:center}
.lap{display:flex;justify-content:space-between;padding:3px 0;border-bottom:2px solid var(--panel2)}
.fld{display:flex;gap:6px;margin:6px 0}
.fld input,.fld select{flex:1;min-width:0;height:44px;background:var(--ink);border:3px solid var(--line);padding:0 8px;border-radius:0}

#ring{position:fixed;inset:0;z-index:9;background:rgba(29,18,32,.78);display:none;align-items:center;justify-content:center;padding:24px}
#ring.on{display:flex}
#ring>div{padding:22px;width:100%;max-width:380px;text-align:center}
#ring .head{font-size:18px;color:var(--ember)}
#ringText{font-size:30px;margin:10px 0 16px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}#sheet{transition:none}}
body.wall #next,body.wall #dock,body.wall #bubble,body.wall #sheet{display:none}
</style>
</head>
<body>
<canvas id="scene" aria-label="A pixel-art living room with a fire burning, a dog named Coffee on the rug and a spaniel resting on the armchair"></canvas>

<div id="next" class="px"><b>NEXT</b><span id="nextT">Nothing planned</span><em id="nextW"></em><button id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 9 9" shape-rendering="crispEdges" fill="currentColor"><path id="fsIcon" d="M0 0h3v1H1v2H0zM6 0h3v3H8V1H6zM0 6h1v2h2v1H0zM8 6h1v3H6V8h2z"/></svg></button></div>

<div id="dock">
  <div id="bubble" role="status"><p id="bubT"></p><button id="undo" hidden>Undo</button></div>
  <div class="row">
    <button class="side" id="openList" aria-label="Open your lists">Lists<i id="badge" hidden></i></button>
    <button id="mic" aria-label="Start listening">
      <svg viewBox="0 0 13 13" shape-rendering="crispEdges" fill="#1d1220"><path d="M5 1h3v1h1v5H8v1H5V7H4V2h1zM2 5h1v2h1v1h1v1h3V8h1V7h1V5h1v3h-1v1H9v1H7v1h2v1H4v-1h2v-1H4V9H3V8H2z"/></svg>
    </button>
    <button class="side" id="openClock" aria-label="Open stopwatch">Timer</button>
  </div>
  <form id="typeform" autocomplete="off"><input id="say" placeholder="or type: remind me to call mom at 7" aria-label="Type a command" enterkeyhint="send"><button>Go</button></form>
</div>

<section id="sheet" class="px" aria-label="Your lists">
  <div id="tabs" role="tablist">
    <button data-t="next" role="tab">Plan</button><button data-t="lists" role="tab">Lists</button><button data-t="clock" role="tab">Clock</button><button data-t="setup" role="tab">Setup</button><button id="close" aria-label="Close">X</button>
  </div>
  <div id="body"></div>
</section>

<div id="ring" role="alertdialog"><div class="px"><div class="head" id="ringK">REMINDER</div><div id="ringText"></div><button class="btn" id="snooze">Snooze 10 min</button><button class="btn go" id="dismiss">Done</button></div></div>

<script>
/*PARSER*/
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,ninety:90};
const NW=Object.keys(NUMW).join('|');
const UNIT="seconds?|secs?|minutes?|mins?|hours?|hrs?|days?|weeks?";
const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const clean=s=>s.replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').trim();
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

function normalize(s){
  s=' '+s+' ';
  s=s.replace(/\b([ap])\.\s?m\b\.?/gi,'$1m');
  s=s.replace(new RegExp('\\b(at|by|for)\\s+('+NW+'|\\d{1,2})\\s+(fifteen|thirty|forty[- ]five)\\b','gi'),(m,p,h,mm)=>{
    const H=NUMW[h.toLowerCase()]||h, M=/fif/i.test(mm)?'15':/thirty/i.test(mm)?'30':'45';
    return p+' '+H+':'+M;});
  s=s.replace(/\b(twenty|thirty|forty|fifty)[ -](one|two|three|four|five|six|seven|eight|nine)\b/gi,(m,a,b)=>NUMW[a.toLowerCase()]+NUMW[b.toLowerCase()]);
  s=s.replace(new RegExp('\\b('+NW+')\\b(?=\\s*(?:'+UNIT+'|o.?clock|am\\b|pm\\b))','gi'),m=>NUMW[m.toLowerCase()]);
  s=s.replace(new RegExp('\\b(at|by)\\s+('+NW+')\\b','gi'),(m,p,w)=>p+' '+NUMW[w.toLowerCase()]);
  s=s.replace(/\b(an?\s+)?hour and a half\b/gi,'90 minutes').replace(/\bhalf an? hour\b|\bhalf hour\b/gi,'30 minutes').replace(/\b(a )?quarter of an hour\b/gi,'15 minutes');
  s=s.replace(/\ba (?:couple of|couple)\s+(?=minutes?|hours?|days?)/gi,'2 ').replace(/\b(?:a )?few\s+(?=minutes?)/gi,'5 ').replace(/\b(?:a )?few\s+(?=hours?)/gi,'3 ');
  s=s.replace(new RegExp('\\ban?\\s+(?='+UNIT+')','gi'),'1 ');
  return s;
}
const DUR=new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+UNIT+')\\b(?:\\s*(?:and\\s*)?(\\d+)\\s*(minutes?|mins?|seconds?|secs?)\\b)?','i');
function unitMs(u){u=u.toLowerCase();return u[0]==='w'?6048e5:u[0]==='d'?864e5:u[0]==='h'?36e5:u[0]==='m'?6e4:1e3;}
function durMs(m){return m[1]*unitMs(m[2])+(m[3]?m[3]*unitMs(m[4]):0);}

function atClock(d,h,mi){const x=new Date(d);x.setHours(h,mi,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

function parseWhen(raw,now){
  let s=normalize(raw); now=new Date(now);
  let m=s.match(new RegExp('\\b(?:in|after)\\s+'+DUR.source,'i'));
  if(m){return{at:now.getTime()+durMs(m.slice(0)),rest:tidy(s.replace(m[0],' '))};}
  let day=null,period=null,fixedDay=false,nextW=false,wd=null;
  const take=re=>{const r=s.match(re);if(r)s=s.replace(r[0],' ');return r;};
  if(take(/\bday after tomorrow\b/i)){day=addDays(now,2);fixedDay=true;}
  else if(take(/\btomorrow\b/i)){day=addDays(now,1);fixedDay=true;}
  else if(take(/\btonight\b/i)){day=new Date(now);fixedDay=true;period='night';}
  else if(take(/\btoday\b/i)){day=new Date(now);fixedDay=true;}
  let r=take(new RegExp('\\b(?:on\\s+)?(next\\s+|this\\s+)?('+DAYS.join('|')+')\\b','i'));
  if(r){wd=DAYS.indexOf(r[2].toLowerCase());nextW=/next/i.test(r[1]||'');let n=(wd-now.getDay()+7)%7;if(nextW&&n===0)n=7;day=addDays(now,n);fixedDay=true;}
  r=take(new RegExp('\\b(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?('+MONTHS.join('|')+')[a-z]*\\b','i'));
  let mo=null,da=null;
  if(r){da=+r[1];mo=MONTHS.indexOf(r[2].slice(0,3).toLowerCase());}
  else{r=take(new RegExp('\\b(?:on\\s+)?('+MONTHS.join('|')+')[a-z]*\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b(?![:.]\\d)','i'));if(r){da=+r[2];mo=MONTHS.indexOf(r[1].slice(0,3).toLowerCase());}}
  if(mo!==null){day=new Date(now.getFullYear(),mo,da);fixedDay=true;if(day<atClock(now,0,0))day.setFullYear(day.getFullYear()+1);}
  r=take(/\b(?:in the |this |at )?(morning|afternoon|evening|night)\b/i);
  if(r)period=r[1].toLowerCase();
  let h=null,mi=0,mer=null;
  r=take(/\b(?:at\s+|by\s+|around\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/i);
  if(r){h=+r[1];mi=+(r[2]||0);mer=r[3].toLowerCase();}
  else if((r=take(/\b(?:at\s+|by\s+|around\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*o.?clock\b/i))||(r=take(/\b(?:at|by|around)\s+(\d{1,2})(?:[:.](\d{2}))?\b(?!\s*(?:%|people|items))/i))){h=+r[1];mi=+(r[2]||0);}
  else if(take(/\b(?:at\s+|by\s+)?noon\b/i)){h=12;mer='pm';}
  else if(take(/\b(?:at\s+|by\s+)?midnight\b/i)){h=12;mer='am';if(!fixedDay){day=addDays(now,1);fixedDay=true;}}
  if(h===null&&!fixedDay&&!period)return{at:null,rest:tidy(s)};
  let at;
  if(h===null){
    const def={morning:9,afternoon:15,evening:18,night:21}[period]??9;
    at=atClock(day||now,def,0);
    if(!fixedDay&&at<=now)at=addDays(at,1);
  }else{
    let ambiguous=false,H=h;
    if(mer)H=h%12+(mer==='pm'?12:0);
    else if(period==='morning')H=h%12;
    else if(period)H=(period==='night'&&h===12)?0:(h<12?h+12:h);
    else if(h>12||h===0)H=h;
    else ambiguous=true;
    if(ambiguous&&!fixedDay){
      const c=[atClock(now,h%12,mi),atClock(now,h%12+12,mi),atClock(addDays(now,1),h%12,mi)];
      at=c.find(x=>x>now);
    }else{
      if(ambiguous)H=h>=7&&h<=11?h:h===12?12:h+12;
      at=atClock(day||now,H,mi);
      if(!fixedDay&&at<=now)at=addDays(at,1);
    }
  }
  if(wd!==null&&at<=now)at=addDays(at,7);
  if(at<=now)at=h===null?new Date(now.getTime()+36e5):addDays(at,1);
  return{at:at.getTime(),rest:tidy(s)};
}
function tidy(s){return clean(s.replace(/\s(at|on|by|in|for)\s*$/i,' ').replace(/^\s*(at|on|by)\s+/i,' '));}

function splitSegments(t){
  t=t.replace(/\b([ap])\.\s?m\b\.?/gi,'$1m');
  return t.split(/[.;!?]+\s+|\n+|,?\s+\b(?:and then|after that|also)\b,?\s+/i).map(s=>clean(s).replace(/[.;!?,]+$/,'')).filter(Boolean);
}
function tagOf(t){
  if(/usmle|uworld|step ?[12]|ck\b|anki|amboss|nbme|flashcard|residency|observership|elective|\bmatch\b/i.test(t))return'Study';
  if(/\breels?\b|youtube|video|thumbnail|instagram|podcast|\bedit\b|script|upload|sponsor|brand/i.test(t))return'Content';
  if(/\bcoffee\b.*(vet|walk|food|groom)|\b(vet|groom)/i.test(t))return'Coffee';
  if(/\bpay\b|bill|rent|invoice|\bbank\b/i.test(t))return'Money';
  return'';
}
const STORES=[['blinkit',/\bblink ?it\b/i],['zepto',/\bzepto\b/i],['instamart',/\b(?:swiggy\s+)?insta ?mart\b/i],['amazon',/\bamazon\b/i]];
function strip(s,re){return clean(s.replace(re,' '));}
const LEAD=/^(?:(?:hey|ok|okay)\s+)?(?:coffee[, ]+)?(?:please\s+|can you\s+|could you\s+|i want you to\s+)*/i;

function interpret(seg,now,opt){
  opt=opt||{};
  const s=clean(seg.replace(LEAD,''));
  if(/\bstop ?watch\b/i.test(s)){
    const r=s.replace(/\bstop ?watch\b/ig,' ');
    return{kind:'stopwatch',action:/\b(stop|pause|halt)\b/i.test(r)?'stop':/\b(reset|clear)\b/i.test(r)?'reset':'start'};
  }
  if(/\btimer\b/i.test(s)){
    if(/\b(cancel|delete|remove|stop|clear)\b/i.test(s))return{kind:'cancel',what:'timer'};
    const n=normalize(s),m=n.match(DUR);
    if(!m)return{kind:'ask',say:'How long should the timer run? Try "timer for 10 minutes".'};
    const ms=durMs(m);
    const label=clean(n.replace(m[0],' ').replace(/\b(set|start|put|create|add|a|an|the|me|on|timer|please)\b/gi,' ')).replace(/^(?:for\s+)+/i,'').replace(/\s*\bfor\b\s*$/i,'').trim();
    return{kind:'timer',ms,text:cap(label)||''};
  }
  if(/\balarm\b|\bwake me\b/i.test(s)){
    if(/\b(cancel|delete|remove|turn off|clear)\b/i.test(s))return{kind:'cancel',what:'alarm'};
    const repeat=/\bevery\s?day\b|\bdaily\b/i.test(s);
    const w=parseWhen(s.replace(/\bevery\s?day\b|\bdaily\b/ig,' '),now);
    if(w.at===null)return{kind:'ask',say:'What time should the alarm ring?'};
    const label=clean(w.rest.replace(/\b(set|put|create|add|an?|the|alarm|wake me(?: up)?|for|please|me)\b/gi,' '));
    return{kind:'alarm',at:w.at,repeat,text:cap(label)||'Alarm'};
  }
  if(/\bremind\b|\breminder\b|\bdon.?t (?:let me )?forget\b/i.test(s)){
    const repeat=/\bevery\s?day\b|\bdaily\b/i.test(s);
    const w=parseWhen(s.replace(/\bevery\s?day\b|\bdaily\b/ig,' '),now);
    let t=clean(w.rest.replace(/\b(?:set|add|create)\s+(?:a\s+)?reminder\b|\bremind me\b|\breminder\b|\bdon.?t (?:let me )?forget\b/ig,' '));
    t=t.replace(/^(?:to|that|about|for|i have to|i need to)\s+/i,'').replace(/^(?:to|that|about)\s+/i,'');
    if(w.at===null)return{kind:'todo',text:cap(t),tag:tagOf(t),noTime:true};
    return{kind:'reminder',at:w.at,repeat,text:cap(t)||'Reminder',tag:tagOf(t)};
  }
  if(/\bwhats ?app\b/i.test(s)||/^(?:send\s+(?:a\s+)?)?(?:message|text)\b/i.test(s)){
    const r=s.replace(/^(?:send\s+)?(?:an?\s+)?(?:whats ?app|message|text)(?:\s+(?:message|text))?\s*/i,'').replace(/\s+on whats ?app\b/i,'');
    const m=r.match(/^(?:to\s+)?(?:my\s+)?(.+?)\s*(?:saying|that says|that|and say|and tell (?:him|her|them)(?: that)?|telling (?:him|her|them)(?: that)?|to say|[,:])\s+(.+)$/i);
    let name=m?m[1]:r.replace(/^(?:to\s+)?(?:my\s+)?/i,''), body=m?m[2]:'';
    return{kind:'whatsapp',name:cap(clean(name)),body:cap(clean(body))};
  }
  let store=null,x=s;
  for(const[k,re]of STORES)if(re.test(x)){store=k;x=x.replace(re,' ');}
  if(/\bshopping list\b|\bgrocery list\b|\bgroceries list\b/i.test(x)){
    const t=clean(x.replace(/\b(?:add|put)\b|\b(?:to|on|in)\s+(?:my\s+|the\s+)?(?:shopping|grocery|groceries) list\b/ig,' '));
    return{kind:'shop',items:items(t)};
  }
  if(/\b(?:order|reorder)\b/i.test(x)||(store&&/\b(?:buy|get)\b/i.test(x))){
    const t=clean(x.replace(/\b(?:place an? order for|place an? order|(?:re)?order|buy|get me|get|from|on|via|using|me|some|please)\b/ig,' '));
    return{kind:'order',store:store||opt.store||'blinkit',items:items(t)};
  }
  if(/^(?:i need to buy|i have to buy|buy|pick up|get)\s+\S/i.test(x)){
    return{kind:'shop',items:items(x.replace(/^(?:i need to buy|i have to buy|buy|pick up|get)\s+/i,'').replace(/^some\s+/i,''))};
  }
  const timedW=parseWhen(s,now);
  if(timedW.at!==null&&/\b(?:call|meet|pay|send|submit|book|take|go|finish|start|need to|have to|meeting|appointment)\b/i.test(s)){
    const tt=clean(timedW.rest.replace(/^(?:i need to|i have to|i must|need to|i should)\s+/i,''));
    return{kind:'reminder',at:timedW.at,repeat:false,text:cap(tt),tag:tagOf(tt)};
  }
  if(/\bto-?\s?do\b|\btask\b|^(?:i need to|i have to|i must|need to|i should|i gotta|gotta)\s/i.test(s)){
    const t=clean(s.replace(/\b(?:add|put|create)\b|\b(?:to|on|in)\s+(?:my\s+|the\s+)?to-?\s?do(?: list)?\b|\b(?:a\s+)?to-?\s?do\b|\b(?:a\s+)?task\b/ig,' ').replace(/^(?:i need to|i have to|i must|need to|i should|i gotta|gotta)\s+/i,'').replace(/^(?:to|that)\s+/i,''));
    return{kind:'todo',text:cap(t),tag:tagOf(t)};
  }
  const t=clean(s.replace(/^(?:take a note|make a note|note down|write down|note)\s*(?:that|:)?\s*/i,''));
  return{kind:'note',text:cap(t),tag:tagOf(t)};
}

    case'timer':add({type:'timer',text:c.text||'Timer',at:now+c.ms,dur:c.ms});return'Timer running: '+left(c.ms)+(c.text?' for '+c.text:'');
